name: Scrape (highlights / TV / tips)

on:
  schedule:
    - cron: '0 */8 * * *' # UTC 8 နာရီတစ်ကြိမ်
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to scrape'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - highlights
          - channels
          - tips

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git Commit & Push လုပ်နိုင်ရန် Permissions ဖွင့်ပေးရန်လိုအပ်သည်

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        env:
          DELIVERY_GITHUB_TOKEN: ${{ secrets.DELIVERY_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "highlights" ]; then
            node src/cli/runPipeline.js --highlights
          elif [ "${{ github.event.inputs.target }}" = "channels" ]; then
            node src/cli/runPipeline.js --channels
          elif [ "${{ github.event.inputs.target }}" = "tips" ]; then
            node src/cli/runPipeline.js --tips
          else
            node src/cli/runPipeline.js --highlights --channels --tips
          fi

      # PAT / Secrets မသုံးဘဲ Repo ထဲသို့ တိုက်ရိုက် Commit & Push လုပ်မည့် အဆင့်
      - name: Commit and push delivery JSONs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/delivery/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update delivery JSONs [skip ci]" && git push)
