# Football scrapes on GitHub-hosted runners (Chrome + RAM).
# Automatic: every 8 hours. Manual: Actions → Run workflow.
name: Scrape (highlights / TV / tips)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which scrape to run
        required: true
        default: all
        type: choice
        options:
          - all
          - highlights
          - channels
          - tips

concurrency:
  group: aws-github-action-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      TZ: Asia/Yangon
      LOW_MEMORY_MODE: 'false'
      USE_LOCAL_CONFIG: 'true'
      LOCAL_CONFIG_DIR: ./config
      PUPPETEER_HEADLESS: 'new'
      PUPPETEER_TIMEOUT_MS: '45000'
      PUPPETEER_BLOCK_RESOURCES: 'true'
      PUPPETEER_CONCURRENCY: '1'
      PUPPETEER_MAX_PAGES: '2'
      BROWSER_RESTART_EVERY_N_PAGES: '8'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_BRANCH: ${{ secrets.GITHUB_BRANCH || 'main' }}
      GITHUB_HIGHLIGHT1_PATH: ${{ secrets.GITHUB_HIGHLIGHT1_PATH || 'highlight1.json' }}
      GITHUB_HIGHLIGHT2_PATH: ${{ secrets.GITHUB_HIGHLIGHT2_PATH || 'highlight2.json' }}
      GITHUB_CHANNELS_PATH: ${{ secrets.GITHUB_CHANNELS_PATH || 'myanmartv.json' }}
      GITHUB_TIPS_PATH: ${{ secrets.GITHUB_TIPS_PATH || 'tips.json' }}
      GITHUB_MATCHES_PATH: ${{ secrets.GITHUB_MATCHES_PATH || 'matches.json' }}
      GITHUB_MAINLIVE_PATH: ${{ secrets.GITHUB_MAINLIVE_PATH || 'mainlive.json' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install npm dependencies
        run: npm ci

      - name: Run scrape
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          run_one() {
            echo "::group::$1"
            node src/cli/runPipeline.js "$2" || echo "::warning::$1 failed (previous JSON kept if scrape empty)"
            echo "::endgroup::"
          }
          if [ "$TARGET" = "highlights" ]; then
            run_one highlights --highlights
          elif [ "$TARGET" = "channels" ]; then
            run_one myanmartv --channels
          elif [ "$TARGET" = "tips" ]; then
            run_one tips --tips
          else
            run_one highlights --highlights
            run_one myanmartv --channels
            run_one tips --tips
          fi

      - name: Commit and push delivery JSONs
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # Same folder as AWS uploads: repo root. Do not overwrite matches.json.
          mkdir -p /tmp/delivery-out
          for f in highlight1.json highlight2.json myanmartv.json tips.json; do
            if [ -f "data/delivery/$f" ]; then
              cp -a "data/delivery/$f" "/tmp/delivery-out/$f"
            fi
          done

          git add data/delivery/*.json
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          mkdir -p data/delivery
          for f in highlight1.json highlight2.json myanmartv.json tips.json; do
            if [ -f "/tmp/delivery-out/$f" ]; then
              cp -a "/tmp/delivery-out/$f" "data/delivery/$f"
              cp -a "/tmp/delivery-out/$f" "./$f"
            fi
          done

          git add data/delivery/*.json
          for f in highlight1.json highlight2.json myanmartv.json tips.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No highlight/TV/tips JSON changes"
            exit 0
          fi
          git commit -m "chore: update delivery JSONs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
